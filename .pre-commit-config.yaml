repos:
  - repo: local
    hooks:
      - id: just-fmt
        name: Format code with just fmt
        entry: just fmt
        language: system
        types: [file]
        files: \.(go)$
        pass_filenames: false
        always_run: false
      - id: just-lint-notests
        name: Lint code with just lint-notests
        entry: just lint-notests
        language: system
        types: [file]
        files: \.(go)$
        pass_filenames: false
        always_run: false
