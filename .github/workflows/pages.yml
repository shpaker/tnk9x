name: Deploy to GitHub Pages

on:
  push:
    tags:
      - '*'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy WASM
    # Дебаг-теги (содержат 'a', см. release.yml) на Pages не публикуем
    if: ${{ !contains(github.ref_name, 'a') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24.3'

      - name: Build WASM bundle
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist/web
          GOOS=js GOARCH=wasm go build -trimpath -ldflags "-s -w -X github.com/shpaker/tnk9x/internal/app.Version=$APP_VERSION" -o dist/web/tnk9x.wasm ./cmd
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" dist/web/
          cp web/index.html dist/web/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
