name: Deploy to GitHub Pages

on:
  push:
    tags:
      - '*'
  # Вызов из Version: тег, запушенный GITHUB_TOKEN, не запускает этот триггер
  workflow_call:
    inputs:
      version:
        description: Релизный тег
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Build and Deploy WASM
    # Альфа-теги (содержат 'a') на Pages не публикуем
    if: ${{ !contains(inputs.version || github.ref_name, 'a') }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'

      - name: Setup Just
        uses: extractions/setup-just@v4

      - name: Build WASM bundle
        env:
          APP_VERSION: ${{ inputs.version || github.ref_name }}
        run: just build-web pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
