name: Release Windows Build

on:
  push:
    tags:
      - '*'

jobs:
  build-windows:
    name: Build Windows Artifact
    runs-on: windows-latest
    strategy:
      matrix:
        build_type: [debug, prod]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24.3'

      - name: Download dependencies
        run: go mod download

      - name: Build Windows executable (debug)
        if: matrix.build_type == 'debug'
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -o dist/gonflict.exe ./cmd

      - name: Build Windows executable (production)
        if: matrix.build_type == 'prod'
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags "-s -w" -o dist/gonflict.exe ./cmd

      - name: Package artifacts
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $suffix = if ("${{ matrix.build_type }}" -eq "prod") { "prod" } else { "debug" }
          $zipName = "bc_${suffix}_$tag.zip"

          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/gonflict.exe package/
          Copy-Item config.yml package/
          Copy-Item assets package/assets -Recurse

          Compress-Archive -Path package/* -DestinationPath $zipName

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-${{ matrix.build_type }}
          path: bc_${{ matrix.build_type }}_${{ github.ref_name }}.zip

