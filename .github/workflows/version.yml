name: Version

# Релиз вручную: версия MAJOR.MINOR по коммитам, накопленным с последнего тега
on:
  workflow_dispatch:

jobs:
  tag:
    name: Tag Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: version
      cancel-in-progress: false
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      HEAD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Just
        uses: extractions/setup-just@v3

      # Релиз только с коммита, на котором CI зелёный
      - name: Check CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion="$(gh run list --workflow ci.yml --commit "$HEAD_SHA" \
            --event push --json conclusion --jq '.[0].conclusion')"
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI for $HEAD_SHA is not green: ${conclusion:-not found}"
            exit 1
          fi

      - name: Compute version
        id: version
        run: |
          # Коммит уже в релизе: ручной тег или повторный запуск
          if [ -n "$(git tag --contains "$HEAD_SHA")" ]; then
            echo "::notice::Commit $HEAD_SHA is already released"
            exit 0
          fi
          version="$(just next-version)"
          if [ -z "$version" ]; then
            echo "::notice::Nothing to release since the last tag"
            exit 0
          fi
          echo "Next version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Push tag
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "$VERSION" "$HEAD_SHA"
          git push origin "$VERSION"

  # Тег от GITHUB_TOKEN не запускает воркфлоу по тегам — вызываем их явно
  release:
    name: Release
    needs: [tag]
    if: needs.tag.outputs.version != ''
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.tag.outputs.version }}
    permissions:
      contents: write

  pages:
    name: Pages
    needs: [tag]
    if: needs.tag.outputs.version != ''
    uses: ./.github/workflows/pages.yml
    with:
      version: ${{ needs.tag.outputs.version }}
    permissions:
      contents: read
      pages: write
      id-token: write
