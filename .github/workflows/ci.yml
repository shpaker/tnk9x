name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24.3'

      - name: Setup Just
        uses: extractions/setup-just@v3

      - name: Download dependencies
        run: just deps

      - name: Install tools
        run: just install-tools

      - name: Check formatting
        run: just fmt-check

  lint:
    name: Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24.3'

      - name: Setup Just
        uses: extractions/setup-just@v3

      - name: Download dependencies
        run: just deps

      - name: Install tools
        run: just install-tools

      - name: Run linter
        run: just lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24.3'

      - name: Setup Just
        uses: extractions/setup-just@v3

      - name: Download dependencies
        run: just deps

      - name: Install tools
        run: just install-tools

      - name: Run tests
        run: just test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [format, lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24.3'

      - name: Setup Just
        uses: extractions/setup-just@v3

      - name: Download dependencies
        run: just deps

      - name: Install tools
        run: just install-tools

      - name: Build application
        run: just build
