name: Release Builds

on:
  push:
    tags:
      - '*'

jobs:
  build:
    name: Build ${{ matrix.os }} ${{ matrix.build_type }}
    runs-on: ${{ matrix.runner }}
    env:
      APP_VERSION: ${{ github.ref_name }}
    strategy:
      matrix:
        os: [windows, linux]
        build_type: [debug, prod]
        include:
          - os: windows
            runner: windows-latest
            goos: windows
            goarch: amd64
          - os: linux
            runner: ubuntu-latest
            goos: linux
            goarch: amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24.3'

      - name: Download dependencies
        run: go mod download

      - name: Build executable (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          if ("${{ matrix.build_type }}" -eq "debug") {
            go build -ldflags "-X github.com/shpaker/gonflict/internal.Version=$env:APP_VERSION -X github.com/shpaker/gonflict/internal.DebugFlag=true" -o dist/gonflict.exe ./cmd
          } else {
            $env:CGO_ENABLED = "0"
            go build -trimpath -ldflags "-s -w -X github.com/shpaker/gonflict/internal.Version=$env:APP_VERSION" -o dist/gonflict.exe ./cmd
          }

      - name: Build executable (Linux)
        if: matrix.os == 'linux'
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          APP_VERSION: ${{ github.ref_name }}
        run: |
          if [ "${{ matrix.build_type }}" = "debug" ]; then
            go build -ldflags "-X github.com/shpaker/gonflict/internal.Version=$APP_VERSION -X github.com/shpaker/gonflict/internal.DebugFlag=true" -o dist/gonflict ./cmd
          else
            CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/shpaker/gonflict/internal.Version=$APP_VERSION" -o dist/gonflict ./cmd
          fi

      - name: Package artifacts (Windows)
        shell: pwsh
        if: matrix.os == 'windows'
        run: |
          $tag = "${{ github.ref_name }}"
          $suffix = "${{ matrix.build_type }}"
          $zipName = "bc_windows_${suffix}_$tag.zip"

          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/gonflict.exe package/
          Copy-Item config.yml package/
          Copy-Item assets package/assets -Recurse

          Compress-Archive -Path package/* -DestinationPath $zipName
          "PACKAGE_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package artifacts (Linux)
        if: matrix.os == 'linux'
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          suffix="${{ matrix.build_type }}"
          zip_name="bc_linux_${suffix}_${TAG_NAME}.zip"

          mkdir -p package/assets
          cp dist/gonflict package/
          cp config.yml package/
          cp -r assets/* package/assets/
          (cd package && zip -r "../${zip_name}" .)
          echo "PACKAGE_NAME=${zip_name}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}-${{ matrix.build_type }}
          path: ${{ env.PACKAGE_NAME }}

