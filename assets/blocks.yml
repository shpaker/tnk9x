brick:
  symbol: "#"
  layer: 1
  sprite_alias: brick
  collidable: true             # Имеет физическую коллизию
  blocks_projectiles: true     # Останавливает снаряды
  destructible: true           # Может быть разрушен
  health: 1                    # Прочность (1 = разрушается одним выстрелом)
  occludes: true               # Скрывает объекты за собой

steel:
  symbol: "@"
  layer: 1
  sprite_alias: steel
  collidable: true             # Имеет физическую коллизию
  blocks_projectiles: true     # Останавливает снаряды
  destructible: true           # Может быть разрушен
  health: 4                    # Прочность (4 = требует усиленные снаряды)
  occludes: true               # Скрывает объекты за собой

forest:
  symbol: "%"
  layer: 2
  sprite_alias: forest
  collidable: false            # НЕ имеет физической коллизии (можно проехать под ним)
  blocks_projectiles: false    # НЕ останавливает снаряды
  destructible: false          # НЕ может быть разрушен
  health: -1                   # Неразрушим (бесконечная прочность)
  occludes: true               # Визуально скрывает объекты (маскировка)

water:
  symbol: "~"
  layer: 1
  sprite_alias: water
  collidable: true             # Имеет физическую коллизию
  blocks_projectiles: false    # НЕ останавливает снаряды (можно стрелять через воду)
  destructible: false          # НЕ может быть разрушен
  health: -1                   # Неразрушим
  occludes: false              # НЕ скрывает объекты
  passable_by: ["hover"]       # Список типов, которые могут пройти

ice:
  symbol: "-"
  layer: 0
  sprite_alias: ice
  collidable: false            # НЕ имеет физической коллизии
  blocks_projectiles: false    # НЕ останавливает снаряды
  destructible: false          # НЕ может быть разрушен
  health: -1                   # Неразрушим
  occludes: false              # НЕ скрывает объекты
  friction: 0.1                # Низкий коэффициент трения (скользкая поверхность)

