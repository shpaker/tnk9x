---
app:
  screen_px: [768, 672]  # Размер экрана в пикселях [width, height], пропорции NES (256x224 логических)
  title_font_size: 24
  subtitle_font_size: 8
  regular_font_size: 8
  game_title: "TNK9X"
  volume: 0.5  # Уровень громкости от 0.0 до 1.0

game:
  enemy_spawners:
    - [0, 0]   # Левый верхний угол
    - [6, 0]   # Центр сверху
    - [12, 0]  # Правый верхний угол
  players_1_spawn_at: [4, 12]
  players_2_spawn_at: [8, 12]
  hq_position: [6, 12]
  ai_update_interval_ticks: 20  # Интервал обновления AI в тиках (60 тиков = 1000мс при 60 FPS)

  # Игровые константы
  base_size_px: 16
  map_blocks_count: [26, 26]  # Размер карты в блоках [width, height]
  max_active_enemies: 4  # Лимит врагов на экране (канон NES — 4)
