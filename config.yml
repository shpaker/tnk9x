---
app:
  screen_px: [768, 672]  # Window size in pixels [width, height], 3x the 256x224 logical screen
  title_font_size: 24
  subtitle_font_size: 8
  regular_font_size: 8
  game_title: "TNK9X"
  # Interface languages: a file assets/locales/<code>.yml for each,
  # the order is the order of the LANGUAGE setting
  languages: [en, ru, tr]
  # Language when the platform language is not supported
  default_language: en
  # Platform languages shown in a supported language instead
  language_fallbacks: {be: ru, kk: ru, uk: ru, uz: ru}
  # From which won stage of a session the platform may ask to rate
  # the game (it asks at most once per session); 0 - never
  rating_after_victories: 3

game:
  enemy_spawners:
    - [0, 0]   # Top left
    - [6, 0]   # Top center
    - [12, 0]  # Top right
  players_1_spawn_at: [4, 12]
  players_2_spawn_at: [8, 12]
  hq_position: [6, 12]

  # Game constants
  base_size_px: 16
  enemy_respawn_delay_ticks: 120  # Default pause between enemy spawns in ticks (2 seconds at 60 TPS)
  map_blocks_count: [26, 26]  # Map size in tiles [width, height]

  # Enemy spawn point choice: players closer than this radius
  # (in tank cells) make a spawner much less likely to be picked
  spawn_player_safe_radius: 4

  # Campaign file: assets/levels/<campaign>.tnkcamp
  campaign: main

  # Reload pause between shots (0.2-0.5 s depending on the tank):
  # no point-blank fire every frame; false: only the bullets-in-flight limit
  shot_cooldown: true

  # Enemies pick up bonuses too, and the nearest one
  # races for a dropped bonus; effects turn against the players (grenade
  # blows up players, timer freezes them, shovel strips the HQ walls,
  # tank adds an enemy); false: bonuses are for players only
  enemy_bonus_pickup: true

  # Defaults for maps without sections and for missing keys,
  # see assets/levels/README.md
  default_level:
    max_active: 4
    time_3star: 180  # seconds
    waves:
      - "BBBBBBBBBB 120 now"
      - "BBBBFFFFPA 120 now"

# In-game purchases where the platform supports them (SHOP in the main
# menu). The id is the product id in the platform catalog, set up there
# by hand; the order here is the order in the shop. Products of the same
# kind share a row: packs and token bundles are picked with left/right.
# Kinds: no_ads - no ads between stages (rewarded ads stay);
# all_levels - every campaign stage; pack - every stage of a campaign
# pack (its order number from 1); tokens - tokens spent instead of
# watching a rewarded ad (REVIVE, BOOST).
shop:
  products:
    - {id: no_ads, kind: no_ads}
    - {id: all_levels, kind: all_levels}
    - {id: pack_2, kind: pack, pack: 2}
    - {id: pack_3, kind: pack, pack: 3}
    - {id: pack_4, kind: pack, pack: 4}
    - {id: pack_5, kind: pack, pack: 5}
    - {id: pack_6, kind: pack, pack: 6}
    - {id: pack_7, kind: pack, pack: 7}
    - {id: tokens_5, kind: tokens, amount: 5}
    - {id: tokens_15, kind: tokens, amount: 15}
    - {id: tokens_40, kind: tokens, amount: 40}
