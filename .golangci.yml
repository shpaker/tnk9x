version: "2"
run:
  timeout: 5m
  issues-exit-code: 1
  tests: true
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
linters:
  default: none
  enable:
    - depguard
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    depguard:
      # Границы слоёв Clean Architecture (см. AGENTS.md)
      rules:
        application:
          files:
            - '**/internal/use_cases/**'
            - '**/internal/services/**'
            - '!$test'
          deny:
            - pkg: github.com/hajimehoshi/ebiten
              desc: движок — только в Presentation и internal/app
            - pkg: github.com/shpaker/tnk9x/internal/adapters
              desc: Application не зависит от Presentation
            - pkg: github.com/shpaker/tnk9x/internal/states
              desc: Application не зависит от Presentation
            - pkg: github.com/shpaker/tnk9x/internal/repositories
              desc: доступ к данным — только через интерфейсы
            - pkg: github.com/shpaker/tnk9x/internal/app
              desc: composition root никем не импортируется
        contracts:
          list-mode: strict
          files:
            - '**/internal/interfaces/**'
            - '!$test'
          allow:
            - $gostd
            - github.com/shpaker/tnk9x/internal/types
        domain:
          list-mode: strict
          files:
            - '**/internal/types/**'
            - '!$test'
          allow:
            - $gostd
            - github.com/shpaker/tnk9x/internal/types
            # Чистая кинематика по сетке, без движка и IO
            - github.com/shpaker/koleya
        i18n-isolation:
          files:
            - '**/internal/**'
            - '**/cmd/**'
            - '!**/internal/adapters/texts/**'
          deny:
            - pkg: github.com/nicksnyder/go-i18n
              desc: go-i18n — только в internal/adapters/texts за ITextsAdapter
        infrastructure:
          files:
            - '**/internal/repositories/**'
            - '!$test'
          deny:
            - pkg: github.com/hajimehoshi/ebiten
              desc: движок — только в Presentation и internal/app
            - pkg: github.com/shpaker/tnk9x/internal/use_cases
              desc: Infrastructure не зависит от Application
            - pkg: github.com/shpaker/tnk9x/internal/services
              desc: Infrastructure не зависит от Application
            - pkg: github.com/shpaker/tnk9x/internal/adapters
              desc: Infrastructure не зависит от Presentation
            - pkg: github.com/shpaker/tnk9x/internal/states
              desc: Infrastructure не зависит от Presentation
            - pkg: github.com/shpaker/tnk9x/internal/app
              desc: composition root никем не импортируется
        js-isolation:
          files:
            - '**/internal/**'
            - '**/cmd/**'
            - '!**/internal/adapters/platform/**'
            - '!**/internal/repositories/raw/**'
          deny:
            - pkg: syscall/js
              desc: браузер — только в internal/adapters/platform за IPlatformAdapter и в хранилище internal/repositories/raw
        kinescope-isolation:
          files:
            - '**/internal/**'
            - '**/cmd/**'
            - '!**/internal/adapters/effects/**'
          deny:
            - pkg: github.com/shpaker/kinescope
              desc: ламповый телевизор — только в internal/adapters/effects за EffectsRendererAdapter
        lua-isolation:
          files:
            - '**/internal/**'
            - '**/cmd/**'
            - '!**/internal/adapters/scripting/**'
            - '!$test'
          deny:
            - pkg: github.com/yuin/gopher-lua
              desc: lua — только в internal/adapters/scripting за IAIScriptEngine
        presentation:
          files:
            - '**/internal/states/**'
            - '**/internal/adapters/**'
            - '!$test'
          deny:
            - pkg: github.com/shpaker/tnk9x/internal/repositories
              desc: доступ к данным — только через интерфейсы
            - pkg: github.com/shpaker/tnk9x/internal/app
              desc: composition root никем не импортируется
    dupl:
      threshold: 100
    goconst:
      min-len: 3
      min-occurrences: 3
    gocyclo:
      min-complexity: 15
    misspell:
      locale: US
  exclusions:
    generated: lax
    paths:
      - .*\.pb\.go$
      - dist
      - web
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/shpaker/tnk9x
  exclusions:
    generated: lax
    paths:
      - .*\.pb\.go$
      - dist
      - web
      - third_party$
      - builtin$
      - examples$
