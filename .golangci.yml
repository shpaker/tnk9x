version: "2"
run:
  timeout: 5m
  issues-exit-code: 1
  tests: true
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
linters:
  default: none
  enable:
    - depguard
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    depguard:
      rules:
        application:
          files:
            - '**/internal/use_cases/**'
            - '**/internal/services/**'
            - '!$test'
          deny:
            - pkg: github.com/hajimehoshi/ebiten
              desc: engine only in Presentation and internal/app
            - pkg: github.com/shpaker/tnk9x/internal/adapters
              desc: Application must not depend on Presentation
            - pkg: github.com/shpaker/tnk9x/internal/states
              desc: Application must not depend on Presentation
            - pkg: github.com/shpaker/tnk9x/internal/repositories
              desc: data access only through interfaces
            - pkg: github.com/shpaker/tnk9x/internal/app
              desc: composition root is imported by no one
        contracts:
          list-mode: strict
          files:
            - '**/internal/interfaces/**'
            - '!$test'
          allow:
            - $gostd
            - github.com/shpaker/tnk9x/internal/types
        domain:
          list-mode: strict
          files:
            - '**/internal/types/**'
            - '!$test'
          allow:
            - $gostd
            - github.com/shpaker/tnk9x/internal/types
            - github.com/shpaker/koleya
            - github.com/shpaker/obstenku
        i18n-isolation:
          files:
            - '**/internal/**'
            - '**/cmd/**'
            - '!**/internal/adapters/texts/**'
          deny:
            - pkg: github.com/nicksnyder/go-i18n
              desc: go-i18n only in internal/adapters/texts behind ITextsAdapter
        infrastructure:
          files:
            - '**/internal/repositories/**'
            - '!$test'
          deny:
            - pkg: github.com/hajimehoshi/ebiten
              desc: engine only in Presentation and internal/app
            - pkg: github.com/shpaker/tnk9x/internal/use_cases
              desc: Infrastructure must not depend on Application
            - pkg: github.com/shpaker/tnk9x/internal/services
              desc: Infrastructure must not depend on Application
            - pkg: github.com/shpaker/tnk9x/internal/adapters
              desc: Infrastructure must not depend on Presentation
            - pkg: github.com/shpaker/tnk9x/internal/states
              desc: Infrastructure must not depend on Presentation
            - pkg: github.com/shpaker/tnk9x/internal/app
              desc: composition root is imported by no one
        js-isolation:
          files:
            - '**/internal/**'
            - '**/cmd/**'
            - '!**/internal/adapters/platform/**'
            - '!**/internal/repositories/raw/**'
          deny:
            - pkg: syscall/js
              desc: browser only in internal/adapters/platform behind IPlatformAdapter and in internal/repositories/raw
        kinescope-isolation:
          files:
            - '**/internal/**'
            - '**/cmd/**'
            - '!**/internal/adapters/effects/**'
          deny:
            - pkg: github.com/shpaker/kinescope
              desc: CRT effect only in internal/adapters/effects behind EffectsRendererAdapter
        lua-isolation:
          files:
            - '**/internal/**'
            - '**/cmd/**'
            - '!**/internal/adapters/scripting/**'
            - '!$test'
          deny:
            - pkg: github.com/yuin/gopher-lua
              desc: Lua only in internal/adapters/scripting behind IAIScriptEngine
        presentation:
          files:
            - '**/internal/states/**'
            - '**/internal/adapters/**'
            - '!$test'
          deny:
            - pkg: github.com/shpaker/tnk9x/internal/repositories
              desc: data access only through interfaces
            - pkg: github.com/shpaker/tnk9x/internal/app
              desc: composition root is imported by no one
    dupl:
      threshold: 100
    goconst:
      min-len: 3
      min-occurrences: 3
    gocyclo:
      min-complexity: 15
    misspell:
      locale: US
  exclusions:
    generated: lax
    paths:
      - .*\.pb\.go$
      - dist
      - web
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/shpaker/tnk9x
  exclusions:
    generated: lax
    paths:
      - .*\.pb\.go$
      - dist
      - web
      - third_party$
      - builtin$
      - examples$
