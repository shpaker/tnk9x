run:
  tests: true
  timeout: 5m

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  print-welcome: false

linters:
  enable:
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
  disable:
    - errcheck
  disable-all: false
  fast: false

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: false
  gofmt:
    simplify: true
  goimports:
    local-prefixes: github.com/shpaker/gonflict
  revive:
    min-confidence: 0.0
    rules:
      - name: exported
        severity: warning
        disabled: false
      - name: error-return
        severity: warning
        disabled: false
      - name: error-naming
        severity: warning
        disabled: false
      - name: var-naming
        severity: warning
        disabled: false
      - name: package-comments
        severity: warning
        disabled: false

issues:
  exclude-dirs:
    - dist
    - bin
    - vendor
  exclude-files:
    - ".*_test\\.go$"
    - ".*\\.pb\\.go$"
    - ".*\\.gen\\.go$"
  exclude-rules:
    # Разрешаем подчеркивания в именах пакетов (намеренное решение архитектуры)
    - path: internal/adapters/input_adapters
      linters:
        - revive
      text: "don't use an underscore in package name"
    - path: internal/use_cases
      linters:
        - revive
      text: "don't use an underscore in package name"
    # Разрешаем GameRepositoriesRegistry (название со стуттером по причинам совместимости)
    - path: internal/repositories/game/game_repository.go
      linters:
        - revive
      text: "type name will be used as.*and that stutters"

